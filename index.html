<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#171a1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Orarul facultății — vizualizare rapidă, filtrare pe grupă și săptămâna pară/impară." />

  <title>UniSchedule</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ ONBOARDING ═══ -->
  <div id="onboarding" class="onboarding">
    <div class="onboarding-content">
      <div class="brand-mark" style="font-size: 3rem; margin-bottom: 1rem; animation: bounceFloat 3s infinite ease-in-out;">
        📅
      </div>
      <h1>UniSchedule</h1>
      <p class="onboarding-subtitle">Orarul tău, simplificat.</p>
      <p class="onboarding-label">Selectează grupa</p>
      <div class="group-buttons">
        <button class="group-btn" data-group="A" id="onboard-group-a">
          A
          <span>Grupa</span>
        </button>
        <button class="group-btn" data-group="B" id="onboard-group-b">
          B
          <span>Grupa</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══ MAIN APP ═══ -->
  <div id="app" class="app hidden">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="header-greeting" id="header-greeting"></span>
        <h1 class="header-title">Orarul Meu</h1>
      </div>
      <div class="header-right">
        <button class="group-chip" id="group-chip" aria-label="Schimbă grupa">
          <span class="dot"></span>
          <span id="group-chip-label">Grupa A</span>
        </button>
        <button class="settings-btn" id="settings-btn" aria-label="Setări">
          ⚙
        </button>
      </div>
    </header>

    <!-- Week Status -->
    <div class="week-banner">
      <div class="week-info">
        <span class="week-type" id="week-type"></span>
        <span class="week-number" id="week-number"></span>
      </div>
      <span class="week-badge odd" id="week-badge"></span>
    </div>

    <!-- Calendar Strip -->
    <div class="calendar-strip-wrapper">
      <div class="calendar-strip" id="calendar-strip"></div>
    </div>

    <!-- Day Tabs -->
    <div class="day-tabs-wrapper">
      <nav class="day-tabs" id="day-tabs"></nav>
    </div>

    <!-- Schedule -->
    <main id="main-content">
      <div class="schedule-container" id="schedule-container"></div>
    </main>

    <div class="semester-info">Sem. I · 2026–2027</div>
  </div>

  <!-- ═══ SETTINGS MODAL ═══ -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-handle"></div>
      <h2>Setări</h2>

      <div class="modal-section">
        <label>Grupa</label>
        <div class="modal-group-buttons">
          <button class="modal-group-btn" data-group="A">Grupa A</button>
          <button class="modal-group-btn" data-group="B">Grupa B</button>
        </div>
      </div>

      <div class="modal-section">
        <label>Semestrul</label>
        <p class="modal-info">
          Săptămâna 1 începe pe 28 septembrie 2026.<br>
          Impare: S1, S3, S5 … S13 &nbsp;·&nbsp; Pare: S2, S4, S6 … S14
        </p>
      </div>

      <button class="modal-close-btn" id="modal-close-btn">Închide</button>
    </div>
  </div>

  <script src="scheduleData.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloadedForUpdate = false;

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hadController && !reloadedForUpdate) {
            reloadedForUpdate = true;
            window.location.reload();
          }
        });

        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
          .then((registration) => registration.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
